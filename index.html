<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premier League Summer Transfers Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pl-purple: #38003c;
    --pl-purple-deep: #240027;
    --pl-raspberry: #e90052;
    --pl-green: #00ff85;
    --pl-cyan: #04f5ff;
    --pl-violet: #963cff;
    --paper: #f6f3f7;
    --card: #ffffff;
    --ink: #1f0a22;
    --muted: #6b5a6e;
    --rule: #e4dbe6;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .masthead {
    background: var(--pl-purple);
    color: #fff;
    padding: 40px 24px 0;
    position: relative;
    overflow: hidden;
  }
  .masthead::after {
    content: "";
    position: absolute;
    right: -120px; top: -160px;
    width: 520px; height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150,60,255,.45), rgba(56,0,60,0) 70%);
    pointer-events: none;
  }
  .wrap { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }
  h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    line-height: 1;
    margin: 0 0 10px;
    letter-spacing: -0.5px;
  }
  .lede { margin: 0 0 28px; max-width: 62ch; color: #e9dcec; }
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: rgba(255,255,255,.15);
    border-top: 1px solid rgba(255,255,255,.15);
  }
  .kpi { background: var(--pl-purple); padding: 18px 20px 22px 0; }
  .kpi + .kpi { padding-left: 20px; }
  .kpi .v {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 2.2rem; font-weight: 700; line-height: 1.1;
  }
  .kpi .l { color: #cdb9d1; font-size: .92rem; }
  .stripe { height: 6px; display: flex; }
  .stripe span { flex: 1; }
  main { padding: 28px 24px 48px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel {
    background: var(--card);
    border-radius: 6px;
    border-top: 5px solid var(--pl-purple);
    padding: 22px 22px 18px;
  }
  .panel.wide { grid-column: 1 / -1; border-top-color: var(--pl-raspberry); }
  .panel.eng { border-top-color: var(--pl-green); }
  .panel.pts { border-top-color: var(--pl-cyan); }
  .panel h2 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 1.6rem; line-height: 1.15;
    margin: 0 0 4px; color: var(--pl-purple);
  }
  .panel .sub { margin: 0 0 16px; color: var(--muted); font-size: .95rem; max-width: 70ch; }
  .chart-box { position: relative; height: 340px; }
  .panel.wide .chart-box { height: 380px; }
  .panel.pts .chart-box { height: 420px; }
  .key { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 10px; padding: 0; font-size: .88rem; color: var(--muted); }
  .key li { display: flex; align-items: center; gap: 7px; }
  .key span { display: inline-block; }
  .k-box { width: 18px; height: 12px; border: 2px solid var(--pl-purple); background: rgba(56,0,60,.12); }
  .k-med { width: 18px; height: 3.5px; background: var(--pl-purple); }
  .k-mean { width: 9px; height: 9px; background: var(--pl-raspberry); transform: rotate(45deg); }
  .k-whisk { width: 2px; height: 14px; background: var(--pl-purple); border-top: 2px solid var(--pl-purple); border-bottom: 2px solid var(--pl-purple); width: 10px; background: linear-gradient(var(--pl-purple),var(--pl-purple)) center/2px 100% no-repeat; }
  .takeaway {
    margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--rule);
    font-size: .95rem;
  }
  .takeaway strong { color: var(--pl-purple); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .92rem; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }
  .table-scroll { overflow-x: auto; }
  .status { max-width: 640px; margin: 60px auto; text-align: center; color: var(--muted); }
  .status.err { color: var(--pl-raspberry); }
  footer { color: var(--muted); font-size: .85rem; max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi, .kpi + .kpi { padding: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const DATA_URL = "https://jagelves.github.io/Data/transfers.csv";
const PL = {
  purple: "#38003c", raspberry: "#e90052", green: "#00ff85",
  cyan: "#04f5ff", violet: "#963cff", muted: "#6b5a6e", grid: "#eee6f0"
};
const LEAGUES = [
  { country: "England",  color: PL.purple },
  { country: "Portugal", color: PL.raspberry },
  { country: "Spain",    color: PL.violet },
  { country: "France",   color: "#00c96a" },
  { country: "Germany",  color: "#00b8c4" }
];

Chart.defaults.font.family = "Barlow, 'Helvetica Neue', Arial, sans-serif";
Chart.defaults.font.size = 13;
Chart.defaults.color = PL.muted;

// ---------- helpers ----------
const num = v => (v === undefined || v === null || String(v).trim() === "" || isNaN(+v)) ? null : +v;
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => a.length ? sum(a) / a.length : 0;
const median = a => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
// same as R's default quantile (type 7), so numbers match boxplot()/ggplot
const quantile = (s, p) => {
  const h = (s.length - 1) * p, lo = Math.floor(h);
  const next = s[lo + 1] !== undefined ? s[lo + 1] : s[lo];
  return s[lo] + (h - lo) * (next - s[lo]);
};
// seeded random so the jitter stays put between redraws
const seeded = seed => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const eur = m => m >= 1000 ? `€${(m / 1000).toFixed(2)}bn` : `€${m.toFixed(0)}m`;

// ---------- chart wrapper ----------
function ChartCanvas({ config, label }) {
  const ref = useRef(null);
  useEffect(() => {
    const chart = new Chart(ref.current, config);
    return () => chart.destroy();
  }, [config]);
  return <div className="chart-box"><canvas ref={ref} role="img" aria-label={label} /></div>;
}

// draws % labels inside the stacked bars
const segmentLabels = {
  id: "segmentLabels",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden) return;
      meta.data.forEach((bar, j) => {
        const v = ds.data[j];
        if (v == null || v < 9) return;
        const { x, y, base } = bar.getProps(["x", "y", "base"], true);
        ctx.save();
        ctx.fillStyle = ds.labelColor || "#fff";
        ctx.font = "600 12px Barlow, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${Math.round(v)}%`, x, (y + base) / 2);
        ctx.restore();
      });
    });
  }
};

// draws Tukey box plots (box = Q1–Q3, line = median, whiskers = 1.5×IQR) behind the jittered points
const boxPlots = {
  id: "boxPlots",
  beforeDatasetsDraw(chart, _args, opts) {
    const { ctx, scales: { x, y } } = chart;
    const half = Math.min(46, (x.getPixelForValue(1) - x.getPixelForValue(0)) * 0.32);
    opts.groups.forEach((g, i) => {
      if (!g.n) return;
      const cx = x.getPixelForValue(i);
      const yq1 = y.getPixelForValue(g.q1), yq3 = y.getPixelForValue(g.q3);
      const ymed = y.getPixelForValue(g.median);
      ctx.save();
      // whiskers
      ctx.strokeStyle = PL.purple; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx, yq3); ctx.lineTo(cx, y.getPixelForValue(g.hi));
      ctx.moveTo(cx, yq1); ctx.lineTo(cx, y.getPixelForValue(g.lo));
      [g.hi, g.lo].forEach(v => {
        const py = y.getPixelForValue(v);
        ctx.moveTo(cx - half * 0.45, py); ctx.lineTo(cx + half * 0.45, py);
      });
      ctx.stroke();
      // box
      ctx.fillStyle = g.color + "33";
      ctx.fillRect(cx - half, yq3, half * 2, yq1 - yq3);
      ctx.lineWidth = 2; ctx.strokeStyle = g.color;
      ctx.strokeRect(cx - half, yq3, half * 2, yq1 - yq3);
      // median
      ctx.lineWidth = 3.5; ctx.strokeStyle = PL.purple;
      ctx.beginPath(); ctx.moveTo(cx - half, ymed); ctx.lineTo(cx + half, ymed); ctx.stroke();
      // mean marker (diamond)
      const ym = y.getPixelForValue(g.mean);
      ctx.fillStyle = PL.raspberry; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx, ym - 6); ctx.lineTo(cx + 6, ym); ctx.lineTo(cx, ym + 6); ctx.lineTo(cx - 6, ym);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
  }
};

// ---------- app ----------
function App() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    Papa.parse(DATA_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.replace(/^\uFEFF/, "").trim(),
      complete: res => {
        const clean = res.data.filter(r => r.season && num(r.fee_eur_m) !== null);
        if (!clean.length) setError("The file loaded but contained no usable rows.");
        else setRows(clean);
      },
      error: err => setError(`Could not download the data (${err.message || err}). Check your internet connection and reload.`)
    });
  }, []);

  const stats = useMemo(() => {
    if (!rows) return null;
    const seasons = [...new Set(rows.map(r => r.season))].sort();
    const bySeason = seasons.map(s => {
      const g = rows.filter(r => r.season === s);
      const eng = g.filter(r => r.from_country === "England").length;
      return {
        season: s,
        fees: sum(g.map(r => num(r.fee_eur_m) || 0)),
        n: g.length,
        engPct: (eng / g.length) * 100
      };
    });
    const leagues = LEAGUES.map(L => {
      const players = rows.filter(r => r.from_country === L.country && num(r.total_points) !== null)
        .map(r => ({ name: r.player, season: r.season, club: r.to_club, pts: num(r.total_points) }));
      const s = players.map(p => p.pts).sort((a, b) => a - b);
      if (!s.length) return { ...L, n: 0, players, mean: 0, median: 0, q1: 0, q3: 0, lo: 0, hi: 0, max: 0 };
      const q1 = quantile(s, 0.25), q3 = quantile(s, 0.75), iqr = q3 - q1;
      const lo = s.find(v => v >= q1 - 1.5 * iqr);
      const hi = [...s].reverse().find(v => v <= q3 + 1.5 * iqr);
      return { ...L, n: s.length, players, mean: mean(s), median: quantile(s, 0.5), q1, q3, lo, hi, max: s[s.length - 1] };
    });
    const totalFees = sum(rows.map(r => num(r.fee_eur_m) || 0));
    const engShare = rows.filter(r => r.from_country === "England").length / rows.length * 100;
    return { seasons, bySeason, leagues, totalFees, engShare, n: rows.length };
  }, [rows]);

  // Chart 1: fees (bars) + number of transfers (line), dual axis
  const feesConfig = useMemo(() => stats && ({
    type: "bar",
    data: {
      labels: stats.seasons,
      datasets: [
        {
          type: "line", label: "Number of transfers",
          data: stats.bySeason.map(d => d.n), yAxisID: "y1", order: 0,
          borderColor: PL.raspberry, backgroundColor: PL.raspberry,
          borderWidth: 3, tension: 0.3, pointRadius: 5, pointHoverRadius: 7,
          pointBackgroundColor: "#fff", pointBorderWidth: 3
        },
        {
          type: "bar", label: "Total fees (€m)",
          data: stats.bySeason.map(d => +d.fees.toFixed(1)), yAxisID: "y", order: 1,
          backgroundColor: PL.purple, hoverBackgroundColor: PL.violet,
          borderRadius: 4, maxBarThickness: 64
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "start", labels: { usePointStyle: true, boxWidth: 10, padding: 18 } },
        tooltip: {
          backgroundColor: PL.purple, padding: 12, titleFont: { weight: "700" },
          callbacks: {
            label: c => c.dataset.yAxisID === "y"
              ? ` Total fees: €${c.parsed.y.toLocaleString()}m`
              : ` Transfers: ${c.parsed.y}`
          }
        }
      },
      scales: {
        x: { grid: { display: false } },
        y: {
          position: "left", beginAtZero: true, grid: { color: PL.grid },
          title: { display: true, text: "Total fees (€ millions)", color: PL.purple, font: { weight: "600" } },
          ticks: { callback: v => `€${v}m` }
        },
        y1: {
          position: "right", beginAtZero: true, grid: { drawOnChartArea: false },
          title: { display: true, text: "Number of transfers", color: PL.raspberry, font: { weight: "600" } }
        }
      }
    }
  }), [stats]);

  // Chart 2: England vs rest of the world, 100% stacked
  const originConfig = useMemo(() => stats && ({
    type: "bar",
    data: {
      labels: stats.seasons,
      datasets: [
        {
          label: "From English clubs", data: stats.bySeason.map(d => d.engPct),
          backgroundColor: PL.purple, labelColor: "#fff", borderRadius: 0
        },
        {
          label: "From the rest of the world", data: stats.bySeason.map(d => 100 - d.engPct),
          backgroundColor: PL.green, labelColor: PL.purple, borderRadius: 0
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "top", align: "start", labels: { usePointStyle: true, boxWidth: 10, padding: 18 } },
        tooltip: {
          backgroundColor: PL.purple, padding: 12,
          callbacks: {
            label: c => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}% (${Math.round(c.parsed.y / 100 * stats.bySeason[c.dataIndex].n)} of ${stats.bySeason[c.dataIndex].n})`
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, max: 100, grid: { color: PL.grid }, ticks: { callback: v => `${v}%` } }
      }
    },
    plugins: [segmentLabels]
  }), [stats]);

  // Chart 3: box plot of first-season FPL points, with every player jittered on top
  const pointsConfig = useMemo(() => {
    if (!stats) return null;
    const rand = seeded(42);
    const L = stats.leagues;
    return {
      type: "scatter",
      data: {
        datasets: L.map((l, i) => ({
          label: l.country,
          data: l.players.map(p => ({ x: i + (rand() - 0.5) * 0.5, y: p.pts, p })),
          backgroundColor: l.color + "66",
          borderColor: l.color === PL.purple ? "#ffffff" : PL.purple + "55",
          borderWidth: 0.75, pointRadius: 3.5, pointHoverRadius: 6
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          boxPlots: { groups: L },
          legend: { display: false },
          tooltip: {
            backgroundColor: PL.purple, padding: 12,
            callbacks: {
              title: c => c[0].raw.p.name,
              label: c => [
                ` ${c.raw.p.pts} pts in ${c.raw.p.season}`,
                ` Joined ${c.raw.p.club} from ${c.dataset.label}`
              ]
            }
          }
        },
        scales: {
          x: {
            type: "linear", min: -0.6, max: L.length - 0.4,
            grid: { display: false },
            afterBuildTicks: axis => { axis.ticks = L.map((_, i) => ({ value: i })); },
            ticks: {
              font: { weight: "600" },
              callback: v => Number.isInteger(v) && L[v] ? [L[v].country, `n = ${L[v].n}`] : ""
            }
          },
          y: {
            beginAtZero: true, grid: { color: PL.grid },
            title: { display: true, text: "First-season total_points", color: PL.purple, font: { weight: "600" } }
          }
        }
      },
      plugins: [boxPlots]
    };
  }, [stats]);

  if (error) return <p className="status err">{error}</p>;
  if (!stats) return <p className="status">Loading transfer data…</p>;

  const first = stats.bySeason[0], last = stats.bySeason[stats.bySeason.length - 1];
  const peakFee = stats.bySeason.reduce((a, b) => (b.fees > a.fees ? b : a));
  const eng = stats.leagues[0];
  const rivals = stats.leagues.slice(1);
  const best = [...stats.leagues].sort((a, b) => b.median - a.median)[0];
  const rivalMedian = median(rivals.flatMap(r => r.players.map(p => p.pts)));
  const engLow = stats.bySeason.reduce((a, b) => (b.engPct < a.engPct ? b : a));
  const engHigh = stats.bySeason.reduce((a, b) => (b.engPct > a.engPct ? b : a));

  return (
    <>
      <header className="masthead">
        <div className="wrap">
          <h1>Premier League summer transfers</h1>
          <p className="lede">
            Every permanent summer signing by Premier League clubs from {first.season} to {last.season}:
            what clubs spent, where the players came from, and how they scored in their first FPL season.
          </p>
          <div className="kpis">
            <div className="kpi"><div className="v">{stats.n.toLocaleString()}</div><div className="l">transfers</div></div>
            <div className="kpi"><div className="v">{eur(stats.totalFees)}</div><div className="l">total fees</div></div>
            <div className="kpi"><div className="v">€{(stats.totalFees / stats.n).toFixed(1)}m</div><div className="l">average fee</div></div>
            <div className="kpi"><div className="v">{stats.engShare.toFixed(0)}%</div><div className="l">signed from English clubs</div></div>
          </div>
        </div>
        <div className="stripe" aria-hidden="true">
          <span style={{ background: PL.raspberry }} /><span style={{ background: PL.green }} />
          <span style={{ background: PL.cyan }} /><span style={{ background: PL.violet }} />
        </div>
      </header>

      <main className="wrap">
        <div className="grid">
          <section className="panel wide">
            <h2>Fees keep climbing, and so does the number of deals</h2>
            <p className="sub">Bars show the total transfer fees paid each season (left axis). The line shows how many players were signed (right axis).</p>
            <ChartCanvas config={feesConfig} label="Total transfer fees and number of transfers by season" />
            <p className="takeaway">
              Spending went from <strong>{eur(first.fees)}</strong> on {first.n} players in {first.season} to{" "}
              <strong>{eur(last.fees)}</strong> on {last.n} players in {last.season}. The biggest summer was{" "}
              <strong>{peakFee.season}</strong> at {eur(peakFee.fees)}.
            </p>
          </section>

          <section className="panel eng">
            <h2>Signed from England vs the rest of the world</h2>
            <p className="sub">Share of each season's signings by the country of the selling club.</p>
            <ChartCanvas config={originConfig} label="Percentage of transfers from English clubs versus abroad by season" />
            <p className="takeaway">
              The English share ranged from <strong>{engLow.engPct.toFixed(0)}%</strong> ({engLow.season}) to{" "}
              <strong>{engHigh.engPct.toFixed(0)}%</strong> ({engHigh.season}).
            </p>
          </section>

          <section className="panel pts">
            <h2>First-season FPL points by origin</h2>
            <p className="sub">England vs the four biggest incoming leagues. Each dot is a player; hover one to see who it is. Players with no FPL match are excluded.</p>
            <ul className="key" aria-label="How to read the box plot">
              <li><span className="k-box" />Middle 50% of players</li>
              <li><span className="k-med" />Median</li>
              <li><span className="k-mean" />Mean</li>
              <li><span className="k-whisk" />Whiskers: 1.5 × IQR</li>
            </ul>
            <ChartCanvas config={pointsConfig} label="First-season total points by origin country" />
            <div className="table-scroll">
              <table>
                <thead><tr><th>From</th><th>Players</th><th>Q1</th><th>Median</th><th>Q3</th><th>Mean</th><th>Best</th></tr></thead>
                <tbody>
                  {stats.leagues.map(l => (
                    <tr key={l.country}>
                      <td><span className="swatch" style={{ background: l.color }} />{l.country}</td>
                      <td>{l.n}</td><td>{l.q1.toFixed(1)}</td><td>{l.median.toFixed(1)}</td><td>{l.q3.toFixed(1)}</td><td>{l.mean.toFixed(1)}</td><td>{l.max}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="takeaway">
              <strong>{best.country}</strong> has the highest median at {best.median.toFixed(1)} points.
              The typical player signed from an English club scores {eng.median.toFixed(1)}, compared with{" "}
              {rivalMedian.toFixed(1)} for the four foreign leagues combined.
              {stats.leagues.every(l => l.mean > l.median) &&
                " Every mean sits above its median because a few standout players (the dots above the whiskers) pull it up."}
            </p>
          </section>
        </div>
      </main>
      <footer>
        Data: jagelves.github.io/Data/transfers.csv, loaded live each time the page opens. "From" refers to the selling club's country (from_country), not the player's nationality.
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
